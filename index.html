<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Useful links</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f8fafc, #e2e8f0);
        color: #0f172a;
        padding: 24px;
      }

      .card {
        width: min(100%, 980px);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        padding: 32px;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        color: #334155;
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      .item {
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        padding: 18px;
        background: #fff;
      }

      .item h2 {
        margin: 0 0 10px;
        font-size: 1.05rem;
        word-break: break-all;
      }

      .item a {
        display: inline-block;
        margin-bottom: 12px;
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
      }

      .item a:hover {
        text-decoration: underline;
      }

      img {
        display: block;
        width: 100%;
        max-width: 180px;
        height: auto;
        margin-top: 8px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
      }

      .center{
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-top: 24px;
        justify-self: center;
        justify-items: center;
        text-align: center;
      }
    </style>
  </head>
